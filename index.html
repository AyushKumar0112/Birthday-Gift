<!doctype html>
<html>
  <head>
    <!-- 1. Character encoding -->
    <meta charset="UTF 8" />

    <!-- 2. Title name -->
    <title>Birthday Gift</title>

    <!-- 3. Google Fonts -->
    <link rel="Preconnect" href="https://fonts.googleapis.com" />
    <link rel="Preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
    />

    <!-- 4. Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all-min-css"
    />

    <!-- 5. Custom Stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="cover_page">
      <div class="video1">
        <div class="video1_display">
            <video
            controls
            autoplay
            muted
            loop
            playsinline
            width="470"
            height="500"
            >
            <source src="video1.mp4" type="video/mp4" />
            </video>
        </div>
      </div>
      <div class="password_phase">
        <div class="password_container">
            <div class="heaading">
            <h1>Enter Passcode</h1>
            <h4>Enter Today's Date</h4>
            </div>
            <div class="display_password">
            <button class="dot" id="box-0">D</button>
            <button class="dot" id="box-1">D</button>
            <button class="dot" id="box-2">M</button>
            <button class="dot" id="box-3">M</button>
            </div>
            <div class="numbers">
            <div class="123">
                <button class="key" data-value="1">1</button>
                <button class="key" data-value="2">2</button>
                <button class="key" data-value="3">3</button>
            </div>
            <div class="456">
                <button class="key" data-value="4">4</button>
                <button class="key" data-value="5">5</button>
                <button class="key" data-value="6">6</button>
            </div>
            <div class="789">
                <button class="key" data-value="7">7</button>
                <button class="key" data-value="8">8</button>
                <button class="key" data-value="9">9</button>
            </div>
            <div class="last">
                <button class="clear">❌</button>
                <button class="key" data-value="0">0</button>
                <button class="submit">✅</button>
            </div>
        </div>
      </div>
    </section>
    <section class="Incorrect_passcode">
      <div class="video2">
        <video
            controls
            autoplay
            muted
            loop
            playsinline
            width="470"
            height="500"
            >
            <source src="video2.mp4" type="video/mp4" />
        </video>
      </div>
      <div class="Incorrect_content">
        <h1>Enter a Passcode</h1>
        <h4>Oops! Wrong Passcode. Try Again, Cutie🥰</h4>
        <div class="wrong_passcode">
          <div class="error-box"></div>
          <div class="error-box"></div>
          <div class="error-box"></div>
          <div class="error-box"></div>
        </div>
        <button class="try_again">Try Again</button>
      </div>
    </section>
    <section class="Exciting_Page">
      <h1 class="heading">Too Excited to Show You Your Gifts.</h1>
      <div class="video3">
        <video
            controls
            autoplay
            muted
            loop
            playsinline
            width="470"
            height="400"
            >
            <source src="video3.mp4" type="video/mp4" />
        </video>
      </div>
      <p>Do You want to see Your Gifts?</p>
      <div class="options">
        <button class="yes">Yes</button>
        <button class="no">No</button>
      </div>
    </section>
    <section class="No_Page">
      <h1 class="content">Do you really don't want to see your Gift.</h1>
      <div class="video4">
        <video
            controls
            autoplay
            muted
            loop
            playsinline
            width="470"
            height="400"
            >
            <source src="video4.mp4" type="video/mp4" />
        </video>
      </div>
      <button class="please">Go Back🥹</button>
    </section>
    <section class="Gift_Page">
      <div class="gifts">
        <img class="gift" src="gift.jpeg">
        <img class="gift" src="gift.jpeg">
        <img class="gift" src="gift.jpeg">
      </div>
      <div class="video5">
        <video
            controls
            autoplay
            muted
            loop
            playsinline
            width="470"
            height="300"
            >
            <source src="video5.mp4" type="video/mp4" />
        </video>
        <h3>Open your gift One by One</h3>
      </div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
