<!doctype html>
<html>
  <head>
    <!-- 1. Character encoding -->
    <meta charset="UTF 8" />

    <!-- 2. Title name -->
    <title>Birthday Gift</title>

    <!-- 3. Google Fonts -->
    <link rel="Preconnect" href="https://fonts.googleapis.com" />
    <link rel="Preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
    />

    <!-- 4. Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all-min-css"
    />

    <!-- 5. Custom Stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="cover_page">
      <div class="video1">
        <div class="video1_display">
            <video
            controls
            autoplay
            muted
            loop
            playsinline
            width="470"
            height="500"
            >
            <source src="video1.mp4" type="video/mp4" />
            </video>
        </div>
      </div>
      <div class="password_phase">
        <div class="password_container">
            <div class="heaading">
            <h1>Enter Passcode</h1>
            <h4>Enter Today's Date</h4>
            </div>
            <div class="display_password">
            <button class="dot" id="box-0">D</button>
            <button class="dot" id="box-1">D</button>
            <button class="dot" id="box-2">M</button>
            <button class="dot" id="box-3">M</button>
            </div>
            <div class="numbers">
            <div class="123">
                <button class="key" data-value="1">1</button>
                <button class="key" data-value="2">2</button>
                <button class="key" data-value="3">3</button>
            </div>
            <div class="456">
                <button class="key" data-value="4">4</button>
                <button class="key" data-value="5">5</button>
                <button class="key" data-value="6">6</button>
            </div>
            <div class="789">
                <button class="key" data-value="7">7</button>
                <button class="key" data-value="8">8</button>
                <button class="key" data-value="9">9</button>
            </div>
            <div class="last">
                <button class="clear">❌</button>
                <button class="key" data-value="0">0</button>
                <button class="submit">✅</button>
            </div>
        </div>
      </div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
